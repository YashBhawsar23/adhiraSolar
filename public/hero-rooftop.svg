<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Illustration of a home with solar panels on the roof">
  <defs>
    <linearGradient id="hero-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hero-roof" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hero-panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1f3b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="url(#hero-sky)"/>

  <!-- Sun -->
  <circle cx="780" cy="120" r="60" fill="#facc15" opacity="0.9"/>

  <!-- Ground -->
  <path d="M0 420C200 380 320 430 480 410C670 386 770 360 960 390V640H0Z" fill="#022c22"/>
  <path d="M0 450C220 420 340 470 500 450C690 424 790 410 960 430V640H0Z" fill="#064e3b"/>

  <!-- House body -->
  <g transform="translate(180 240)">
    <rect x="40" y="140" width="520" height="190" rx="24" fill="#020617" opacity="0.96"/>
    <!-- Door + window hint -->
    <rect x="90" y="210" width="70" height="110" rx="10" fill="#020617" stroke="#0f172a" stroke-width="3"/>
    <rect x="210" y="200" width="90" height="55" rx="10" fill="#020617" stroke="#0f172a" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Roof with solar panels -->
  <g transform="translate(180 160)">
    <!-- Roof shape -->
    <path d="M40 200L280 40L520 200Z" fill="url(#hero-roof)" />
    <!-- Panels group -->
    <g transform="translate(190 85)">
      <rect x="0" y="0" width="260" height="90" rx="14" fill="url(#hero-panel)" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
      <!-- Panel grid -->
      <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
        <line x1="20" y1="28" x2="240" y2="28"/>
        <line x1="20" y1="56" x2="240" y2="56"/>
        <line x1="66" y1="12" x2="66" y2="78"/>
        <line x1="132" y1="12" x2="132" y2="78"/>
        <line x1="198" y1="12" x2="198" y2="78"/>
      </g>
      <!-- Highlight -->
      <rect x="0" y="0" width="260" height="90" rx="14" fill="url(#hero-panel)" opacity="0.35"/>
    </g>
  </g>
</svg>

